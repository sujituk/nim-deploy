apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: nim-on-gke
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: NVIDIA NIM™ on GKE
    source:
      repo: https://github.com/NVIDIA/nim-deploy
      sourceType: git
      dir: /test-infra-mgr/cloud-service-providers/google-cloud/gke
    actuationTool:
      flavor: Terraform
    description: {}
  content: {}
  interfaces:
    variables:
      - name: acknowledge
        varType: bool
        required: true
      - name: additional_labels
        description: Additional labels to add to Kubernetes resources.
        varType: string
        defaultValue: "created-by=gke-ai-quick-start-solutions,ai.gke.io=nim"
      - name: cluster_name
        varType: string
        defaultValue: "nim-on-gke"
      - name: create_network
        description: Create the VPC specified by network_name/subnetwork_name
        varType: bool
        defaultValue: true
      - name: enable_gpu
        varType: bool
        defaultValue: true
      - name: goog_cm_deployment_name
        varType: string
        defaultValue: "nim-on-gke"        
      - name: kubernetes_namespace
        varType: string
        required: true
        defaultValue: "nim"
      - name: network_name
        varType: string
        required: true
        defaultValue: "vpc"
      - name: project_id
        description: GCP project id
        varType: string
        required: true
      - name: subnetwork_cidr
        varType: string
        defaultValue: "10.100.0.0/16"
      - name: subnetwork_name
        varType: string
        required: true
        defaultValue: "subnet"
      - name: ngc_username
        varType: string
        required: true
        defaultValue: "$oauthtoken"
      - name: registry_server
        varType: string
        required: true
        #defaultValue: "nvcr.io"
        defaultValue: "us-docker.pkg.dev/nvidia-vgpu-public"
      - name: tag
        description: "Docker repository tag of NIM container"
        varType: string
        required: true
      - name: model_name
        description: "Pick a NIM model name"
        varType: string
        required: true
        defaultValue: ""
      - name: llama3_8b
        description: "model"
        varType: static_text
      - name: llama3_70b
        description: "model"
        varType: static_text
      - name: llama31_8b
        description: "model"
        varType: static_text
      - name: mixtral_7b
        description: "model"
        varType: static_text
      - name: mistral_7b
        description: "model"
        varType: static_text
      - name: nv_rerankqa_mistral_4b_v3
        description: "model"
        varType: static_text
      - name: nv_embedqa_e5_v5
        description: "model"
        varType: static_text
      - name: nim_license
        description: Terms and Conditions
        varType: bool
        defaultValue: false
        required: true
      - name: llama3_8b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: llama31_8b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: llama3_70b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: llama31_405b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: llama31_70b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: mixtral_7b_compatibility
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: mistral_7b_compatibility
        description: "Pick a GPU"
        varType: string
      - name: nv_mistral_compatibility
        description: "Pick a GPU"
        varType: string
      - name: nv_mistral_7b_compatibility
        description: "Pick a GPU"
        varType: string
      - name: nv_embedqa_e5_compatibility
        description: "Pick a GPU"
        varType: string
      - name: l4_machine_selection
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: h100_machine_selection
        description: "Pick a GPU"
        varType: string
        defaultValue: ""
      - name: a100_llama3_8b_selection
        description: "Pick a machine type"
        varType: string
        defaultValue: ""
      - name: a100_llama3_70b_selection
        description: "Pick a machine type"
        varType: string
        defaultValue: ""
      - name: a100_llama31_70b_selection
        description: "Pick a machine type"
        varType: string
        defaultValue: ""
      - name: a100_mixtral_7b_selection
        description: "Pick a machine type"
        varType: string
        defaultValue: ""
      - name: a100_nv_mistral_selection
        description: "Pick a machine type"
        varType: string
        defaultValue: ""
      - name: compatible_cluster_location_l4
        description: "Pick a region"
        varType: string
      - name: compatible_cluster_location_a100
        description: "Pick a region"
        varType: string
      - name: compatible_cluster_location_h100
        description: "Pick a region"
        varType: string
      - name: gpu_limits
        description: "GPU limits"
        varType: number
        defaultValue: 1
      - name: production
        varType: bool
      - name: ngc_api_key
        varType: string
        defaultValue: ""
    outputs:
      - name: cluster_name
        description: GKE cluster name where the NIMs are running
      - name: compatible_cluster_location_l4
        description: GKE cluster location
      - name: compatible_cluster_location_a100
        description: GKE cluster location
      - name: compatible_cluster_location_h100
        description: GKE cluster location
      - name: project_id
        description: GCP project
      - name: endpoint
        description: GKE cluster endpoint